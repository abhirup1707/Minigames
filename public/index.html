<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Car Ball</title><link rel="stylesheet" href="style.css"></head><body><div id="lobby"><h1>🚗 CAR <span>BALL</span></h1><p>Drive. Jump. Boost. Score.</p><input id="name" maxlength="12" placeholder="Your name"><button id="create">CREATE ROOM</button><div class="or">OR JOIN</div><div class="join"><input id="code" maxlength="4" placeholder="CODE"><button id="join">JOIN</button></div><div id="error"></div></div><div id="game" hidden><header><b>🚗 CAR BALL</b><div class="score"><span id="blue">0</span> — <span id="orange">0</span></div><div><span id="time">3:00</span> <span id="room"></span></div></header><canvas id="canvas" width="1280" height="720"></canvas><div id="controls">WASD / Arrows = Drive &nbsp; SPACE = Jump &nbsp; SHIFT = Boost</div><button id="start">START MATCH</button><div id="overlay" hidden><div><h1 id="winner"></h1><button id="again">PLAY AGAIN</button></div></div></div><script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
