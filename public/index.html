<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Co-op Chaos</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><section id="lobby" class="card"><h1>CO-OP <span>CHAOS</span></h1><p>Work together. Panic together.</p><input id="name" maxlength="14" placeholder="Your name"><button id="create">CREATE ROOM</button><div class="join"><input id="code" maxlength="5" placeholder="ROOM CODE"><button id="join">JOIN</button></div><small id="error"></small></section><section id="game" hidden><header><div><b id="levelName">LEVEL 1</b><small id="hint"></small></div><div id="room"></div><button id="start">START</button></header><canvas id="canvas" width="1500" height="720"></canvas><div class="mobile"><button data-k="left">◀</button><button data-k="jump">▲</button><button data-k="right">▶</button></div><div id="win" hidden><h2>LEVEL COMPLETE! 🎉</h2><button id="next">NEXT LEVEL</button></div></section></div><script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
